<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天堂私服 - 過3裝強化期望成本計算器</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 950px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .currency-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .currency-toggle button {
            background-color: #2c3e50;
            color: #fff;
            border: 2px solid transparent;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .currency-toggle button.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group label {
            font-size: 14px;
            flex: 1;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .form-group input, .form-group select {
            width: 100px;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
            text-align: right;
            font-size: 14px;
        }

        .unit-symbol {
            font-size: 14px;
            color: var(--text-color);
            width: 15px;
        }

        .currency-inputs {
            display: none;
        }

        .currency-inputs.active {
            display: block;
        }

        .results {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .results h2 {
            margin-top: 0;
            color: var(--accent-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #2a2a2a;
            color: var(--accent-color);
        }

        tr.highlight {
            background-color: rgba(243, 156, 18, 0.15);
            font-weight: bold;
        }

        .badge {
            background-color: #27ae60;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 5px;
        }

        .note {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>天堂私服 過3裝強化期望成本計算器</h1>

    <!-- 幣別切換 -->
    <div class="currency-toggle">
        <button id="btn-aden" class="active" onclick="setCurrency('aden')">天幣模式</button>
        <button id="btn-ticket" onclick="setCurrency('ticket')">銀票模式</button>
    </div>

    <div class="grid">
        <!-- 物品價格設定 -->
        <div class="card">
            <h2>物品價格設定 (<span class="unit-title">天幣</span>)</h2>

            <!-- 天幣專用價格輸入區 -->
            <div id="aden-inputs" class="currency-inputs active">
                <div class="form-group">
                    <label for="eqPrice_aden">裝備單價 (天幣):</label>
                    <div class="input-wrap">
                        <input type="text" id="eqPrice_aden" class="number-input" oninput="handlePriceInput(this)">
                    </div>
                </div>
                <div class="form-group">
                    <label for="nPrice_aden">防卷 單價 (天幣):</label>
                    <div class="input-wrap">
                        <input type="text" id="nPrice_aden" class="number-input" oninput="handlePriceInput(this)">
                    </div>
                </div>
                <div class="form-group">
                    <label for="bPrice_aden">祝防 單價 (天幣):</label>
                    <div class="input-wrap">
                        <input type="text" id="bPrice_aden" class="number-input" oninput="handlePriceInput(this)">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cPrice_aden">紅防 單價 (天幣):</label>
                    <div class="input-wrap">
                        <input type="text" id="cPrice_aden" class="number-input" oninput="handlePriceInput(this)">
                    </div>
                </div>
            </div>

            <!-- 銀票專用價格輸入區 -->
            <div id="ticket-inputs" class="currency-inputs">
                <div class="form-group">
                    <label for="eqPrice_ticket">裝備單價 (銀票):</label>
                    <div class="input-wrap">
                        <input type="text" id="eqPrice_ticket" class="number-input" oninput="handlePriceInput(this)">
                    </div>
                </div>
                <div class="form-group">
                    <label for="nPrice_ticket">防卷 單價 (銀票):</label>
                    <div class="input-wrap">
                        <input type="text" id="nPrice_ticket" class="number-input" oninput="handlePriceInput(this)">
                    </div>
                </div>
                <div class="form-group">
                    <label for="bPrice_ticket">祝防 單價 (銀票):</label>
                    <div class="input-wrap">
                        <input type="text" id="bPrice_ticket" class="number-input" oninput="handlePriceInput(this)">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cPrice_ticket">紅防 單價 (銀票):</label>
                    <div class="input-wrap">
                        <input type="text" id="cPrice_ticket" class="number-input" oninput="handlePriceInput(this)">
                    </div>
                </div>
            </div>
        </div>

        <!-- 成功機率與安定值設定 -->
        <div class="card">
            <h2>強化成功率與設定</h2>
            <div class="form-group">
                <label for="safeValue">裝備安定值:</label>
                <div class="input-wrap">
                    <select id="safeValue" onchange="toggleProbInputs(); saveAndCalculate();">
                        <option value="4">安定 4 (目標 +7)</option>
                        <option value="6">安定 6 (目標 +9)</option>
                    </select>
                    <span class="unit-symbol"></span>
                </div>
            </div>

            <!-- 各階成功率欄位 -->
            <div id="prob-4to5" class="form-group">
                <label for="p4to5">+4 升 +5 成功率 (4過1):</label>
                <div class="input-wrap">
                    <input type="number" id="p4to5" step="0.01" value="25" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
            <div id="prob-5to6" class="form-group">
                <label for="p5to6">+5 升 +6 成功率 (5過1):</label>
                <div class="input-wrap">
                    <input type="number" id="p5to6" step="0.01" value="20" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
            <div id="prob-6to7" class="form-group">
                <label for="p6to7">+6 升 +7 成功率 (6過1):</label>
                <div class="input-wrap">
                    <input type="number" id="p6to7" step="0.01" value="16.67" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
            <div id="prob-7to8" class="form-group">
                <label for="p7to8">+7 升 +8 成功率 (7過1):</label>
                <div class="input-wrap">
                    <input type="number" id="p7to8" step="0.01" value="14.29" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
            <div id="prob-8to9" class="form-group">
                <label for="p8to9">+8 升 +9 成功率 (8過1):</label>
                <div class="input-wrap">
                    <input type="number" id="p8to9" step="0.01" value="12.5" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>

            <div class="form-group">
                <label for="pB2Ratio">祝防跳+2佔成功率:</label>
                <div class="input-wrap">
                    <input type="number" id="pB2Ratio" step="1" value="50" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 計算結果展示 -->
    <div class="results">
        <h2>強化方案成本比較 (<span id="target-title">過3裝</span>)</h2>
        <table>
            <thead>
                <tr>
                    <th>強化方案策略描述</th>
                    <th><span id="target-text">+7</span> 期望總成本 (<span class="unit-title">天幣</span>)</th>
                    <th>說明</th>
                </tr>
            </thead>
            <tbody id="result-rows">
                <!-- 動態繪製結果 -->
            </tbody>
        </table>
        <div class="note">
            * 預設強化機率已設為「N過1」邏輯：+4(25%)、+5(20%)、+6(16.67%)、+7(14.29%)、+8(12.5%)。<br>
            * 安定 4 目標為點至 +7 (過3)；安定 6 目標為點至 +9 (過3)。
        </div>
    </div>
</div>

<script>
    const defaultParams = {
        currency: 'aden',
        eqPrice_aden: 100000,
        nPrice_aden: 25000,
        bPrice_aden: 700000,
        cPrice_aden: 0,

        eqPrice_ticket: 10,
        nPrice_ticket: 2,
        bPrice_ticket: 70,
        cPrice_ticket: 0,

        safeValue: "4",
        p4to5: 25,
        p5to6: 20,
        p6to7: 16.67,
        p7to8: 14.29,
        p8to9: 12.5,
        pB2Ratio: 50
    };

    let currentCurrency = 'aden';

    function formatThousands(val) {
        if (val === "" || val === null || val === undefined) return "";
        const cleanNum = val.toString().replace(/,/g, '');
        if (isNaN(cleanNum)) return "";
        const parts = cleanNum.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return parts.join('.');
    }

    function parseNumber(val) {
        if (!val) return 0;
        const clean = val.toString().replace(/,/g, '');
        return parseFloat(clean) || 0;
    }

    function handlePriceInput(input) {
        const rawValue = input.value.replace(/,/g, '');
        if (!isNaN(rawValue)) {
            input.value = formatThousands(rawValue);
        }
        saveAndCalculate();
    }

    function toggleProbInputs() {
        const safeMode = document.getElementById('safeValue').value;
        const targetTitle = document.getElementById('target-title');
        const targetText = document.getElementById('target-text');

        if (safeMode === "4") {
            document.getElementById('prob-4to5').style.display = 'flex';
            document.getElementById('prob-5to6').style.display = 'flex';
            document.getElementById('prob-6to7').style.display = 'flex';
            document.getElementById('prob-7to8').style.display = 'none';
            document.getElementById('prob-8to9').style.display = 'none';
            targetTitle.innerText = "安定4過3裝 (+7)";
            targetText.innerText = "+7";
        } else {
            document.getElementById('prob-4to5').style.display = 'none';
            document.getElementById('prob-5to6').style.display = 'none'; // 安定6內 100%
            document.getElementById('prob-6to7').style.display = 'flex';
            document.getElementById('prob-7to8').style.display = 'flex';
            document.getElementById('prob-8to9').style.display = 'flex';
            targetTitle.innerText = "安定6過3裝 (+9)";
            targetText.innerText = "+9";
        }
    }

    function loadParams() {
        const stored = localStorage.getItem('lineage_calc_params_v9');
        let params = defaultParams;
        if (stored) {
            try {
                params = { ...defaultParams, ...JSON.parse(stored) };
            } catch (e) {
                params = defaultParams;
            }
        }

        const priceKeys = [
            'eqPrice_aden', 'nPrice_aden', 'bPrice_aden', 'cPrice_aden',
            'eqPrice_ticket', 'nPrice_ticket', 'bPrice_ticket', 'cPrice_ticket'
        ];
        priceKeys.forEach(key => {
            const input = document.getElementById(key);
            if (input) input.value = formatThousands(params[key]);
        });

        const normalKeys = ['p4to5', 'p5to6', 'p6to7', 'p7to8', 'p8to9', 'pB2Ratio'];
        normalKeys.forEach(key => {
            const input = document.getElementById(key);
            if (input) input.value = params[key];
        });

        const safeSelect = document.getElementById('safeValue');
        if (safeSelect) safeSelect.value = params.safeValue || "4";

        if (params.currency) currentCurrency = params.currency;
        
        toggleProbInputs();
        updateCurrencyUI();
    }

    function saveParams() {
        const params = { currency: currentCurrency };

        const priceKeys = [
            'eqPrice_aden', 'nPrice_aden', 'bPrice_aden', 'cPrice_aden',
            'eqPrice_ticket', 'nPrice_ticket', 'bPrice_ticket', 'cPrice_ticket'
        ];
        priceKeys.forEach(key => {
            const el = document.getElementById(key);
            params[key] = el ? parseNumber(el.value) : 0;
        });

        const normalKeys = ['p4to5', 'p5to6', 'p6to7', 'p7to8', 'p8to9', 'pB2Ratio'];
        normalKeys.forEach(key => {
            const el = document.getElementById(key);
            params[key] = el ? parseFloat(el.value) || 0 : 0;
        });

        params.safeValue = document.getElementById('safeValue').value;

        localStorage.setItem('lineage_calc_params_v9', JSON.stringify(params));
    }

    function setCurrency(type) {
        currentCurrency = type;
        updateCurrencyUI();
        saveAndCalculate();
    }

    function updateCurrencyUI() {
        document.getElementById('btn-aden').classList.toggle('active', currentCurrency === 'aden');
        document.getElementById('btn-ticket').classList.toggle('active', currentCurrency === 'ticket');

        document.getElementById('aden-inputs').classList.toggle('active', currentCurrency === 'aden');
        document.getElementById('ticket-inputs').classList.toggle('active', currentCurrency === 'ticket');
        
        const unitText = currentCurrency === 'aden' ? '天幣' : '銀票';
        document.querySelectorAll('.unit-title').forEach(el => el.innerText = unitText);
    }

    function saveAndCalculate() {
        saveParams();
        calculate();
    }

    function formatNum(num) {
        if (isNaN(num) || !isFinite(num)) return "無法計算";
        return num.toLocaleString('zh-TW', {
            minimumFractionDigits: currentCurrency === 'ticket' ? 2 : 0,
            maximumFractionDigits: currentCurrency === 'ticket' ? 2 : 0
        });
    }

    function calculate() {
        const suffix = currentCurrency === 'aden' ? '_aden' : '_ticket';

        const eqP = parseNumber(document.getElementById('eqPrice' + suffix).value);
        const nP = parseNumber(document.getElementById('nPrice' + suffix).value);
        const bP = parseNumber(document.getElementById('bPrice' + suffix).value);
        const cP = parseNumber(document.getElementById('cPrice' + suffix).value);

        const safeMode = document.getElementById('safeValue').value;

        const p4to5 = (parseFloat(document.getElementById('p4to5').value) || 0) / 100;
        const p5to6 = (parseFloat(document.getElementById('p5to6').value) || 0) / 100;
        const p6to7 = (parseFloat(document.getElementById('p6to7').value) || 0) / 100;
        const p7to8 = (parseFloat(document.getElementById('p7to8').value) || 0) / 100;
        const p8to9 = (parseFloat(document.getElementById('p8to9').value) || 0) / 100;
        const b2Ratio = (parseFloat(document.getElementById('pB2Ratio').value) || 0) / 100;

        let plans = [];

        if (safeMode === "4") {
            // === 安定 4 (目標 +7) ===
            if (p4to5 <= 0 || p5to6 <= 0 || p6to7 <= 0) return;

            const costSafe = eqP + (4 * nP);
            const costPlus3 = eqP + (3 * nP);

            // 1. 全用普通防卷
            const c5_N = (costSafe + nP) / p4to5;
            const c6_N = (c5_N + nP) / p5to6;
            const c7_PlanA = (c6_N + nP) / p6to7;

            // 2. +4 點祝防，其餘補普通防卷
            const pB4_plus2 = p4to5 * b2Ratio;
            const pB4_plus1 = p4to5 * (1 - b2Ratio);
            let c6_PlanB_base = ((costSafe + bP) - (pB4_plus1 * c5_N)) / pB4_plus2;
            if (c6_PlanB_base < 0) c6_PlanB_base = 0;
            const c7_PlanB = (c6_PlanB_base + nP) / p6to7;

            // 3. +3 砸祝防 + 紅防歸位，+5 再用祝防
            const pB5_plus2 = p5to6 * b2Ratio;
            const pB5_plus1 = p5to6 * (1 - b2Ratio);
            const c5_PlanC = costPlus3 + (2 * bP) + cP;
            const c7_PlanC = (c5_PlanC + bP + (pB5_plus1 * nP)) / (pB5_plus2 + (pB5_plus1 * p6to7));

            plans = [
                { name: "方案 A：全用普通防卷", cost: c7_PlanA, desc: "從 +4 硬衝到 +7，最傳統穩定的點法。" },
                { name: "方案 B：+4 用祝防，其餘用普通防卷", cost: c7_PlanB, desc: "+4 賭跳 +6 規避 +5 高爆率階段，再用普通防卷衝 +7。" },
                { name: "方案 C：+3 砸祝防 + 紅防歸位，+5 再用祝防", cost: c7_PlanC, desc: "+3 砸祝防，變 +4 用紅防降回 +3 重點到 +5，再用祝防衝 +7。" }
            ];

        } else {
            // === 安定 6 (目標 +9) ===
            if (p6to7 <= 0 || p7to8 <= 0 || p8to9 <= 0) return;

            const costPlus5 = eqP + (5 * nP);
            const costPlus6 = eqP + (6 * nP);

            // 1. 全用普通防卷 (衝到 +6 無風險，+6衝+7, +7衝+8, +8衝+9)
            const c7_N = (costPlus6 + nP) / p6to7;
            const c8_N = (c7_N + nP) / p7to8;
            const c9_PlanA = (c8_N + nP) / p8to9;

            // 2. +5 點祝防衝 +7，後續補普通防卷至 +9
            const pB_jump2 = b2Ratio;
            const pB_jump1 = 1 - b2Ratio;
            const c7_PlanB_base = (costPlus5 + bP + (pB_jump1 * nP)) / (pB_jump2 + (pB_jump1 * p6to7));
            const c8_PlanB = (c7_PlanB_base + nP) / p7to8;
            const c9_PlanB = (c8_PlanB + nP) / p8to9;

            // 3. +5 點祝防，+7 再點祝防拼 +9
            const pB7_plus2 = p7to8 * b2Ratio;
            const pB7_plus1 = p7to8 * (1 - b2Ratio);
            const c9_PlanC = (c7_PlanB_base + bP + (pB7_plus1 * nP)) / (pB7_plus2 + (pB7_plus1 * p8to9));

            plans = [
                { name: "方案 A：全用普通防卷", cost: c9_PlanA, desc: "一路用普通防卷點至 +9。" },
                { name: "方案 B：+5 砸祝防(拼+7)，其餘用普通防卷", cost: c9_PlanB, desc: "+5 砸祝防 100% 成功，獲得 +7 後補普通防卷衝 +9。" },
                { name: "方案 C：+5 砸祝防 + +7 砸祝防", cost: c9_PlanC, desc: "+5 與 +7 均使用祝防拼雙重跳級效益。" }
            ];
        }

        plans.sort((a, b) => a.cost - b.cost);

        const tbody = document.getElementById('result-rows');
        tbody.innerHTML = '';

        plans.forEach((plan, index) => {
            const tr = document.createElement('tr');
            if (index === 0) tr.classList.add('highlight');

            tr.innerHTML = `
                <td>
                    ${plan.name}
                    ${index === 0 ? '<span class="badge">最省錢首選</span>' : ''}
                </td>
                <td>${formatNum(plan.cost)}</td>
                <td>${plan.desc}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = function() {
        loadParams();
        calculate();
    };
</script>

</body>
</html>
