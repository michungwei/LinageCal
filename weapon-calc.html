<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天堂私服 - 武器+9(過3)強化期望成本計算器</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #e74c3c; /* 武器計算器採用熱血戰鬥紅 */
            --accent-gold: #f39c12;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 950px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .rate-card {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .rate-card label {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 15px;
        }

        .rate-card input {
            width: 140px;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
            text-align: right;
            font-size: 15px;
            font-weight: bold;
        }

        .currency-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .currency-toggle button {
            background-color: #2c3e50;
            color: #fff;
            border: 2px solid transparent;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .currency-toggle button.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group label {
            font-size: 14px;
            flex: 1;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .form-group input {
            width: 110px;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
            text-align: right;
            font-size: 14px;
        }

        .unit-symbol {
            font-size: 14px;
            color: var(--text-color);
            width: 15px;
        }

        .currency-inputs {
            display: none;
        }

        .currency-inputs.active {
            display: block;
        }

        .results {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .results h2 {
            margin-top: 0;
            color: var(--accent-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #2a2a2a;
            color: var(--accent-color);
        }

        tr.highlight {
            background-color: rgba(231, 76, 60, 0.18);
            font-weight: bold;
        }

        .badge {
            background-color: #27ae60;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 5px;
        }

        .note {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>天堂私服 武器+9 (過3) 強化期望成本計算器</h1>

    <!-- 匯率比值設定區 -->
    <div class="rate-card">
        <label for="rate">1 銀票等於幾天幣：</label>
        <input type="text" id="rate" class="number-input" oninput="handleRateInput(this)">
    </div>

    <!-- 幣別切換 -->
    <div class="currency-toggle">
        <button id="btn-aden" class="active" onclick="setCurrency('aden')">天幣模式</button>
        <button id="btn-ticket" onclick="setCurrency('ticket')">銀票模式</button>
    </div>

    <div class="grid">
        <!-- 物品價格設定 -->
        <div class="card">
            <h2>物品價格設定 (<span class="unit-title">天幣</span>)</h2>

            <!-- 天幣專用價格輸入區 -->
            <div id="aden-inputs" class="currency-inputs active">
                <div class="form-group">
                    <label for="eqPrice_aden">武器單價 (天幣):</label>
                    <div class="input-wrap">
                        <input type="text" id="eqPrice_aden" class="number-input" oninput="handlePriceInput(this, 'aden')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="nPrice_aden">武卷 單價 (天幣):</label>
                    <div class="input-wrap">
                        <input type="text" id="nPrice_aden" class="number-input" oninput="handlePriceInput(this, 'aden')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="bPrice_aden">祝武卷 單價 (天幣):</label>
                    <div class="input-wrap">
                        <input type="text" id="bPrice_aden" class="number-input" oninput="handlePriceInput(this, 'aden')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cPrice_aden">紅武卷 單價 (天幣):</label>
                    <div class="input-wrap">
                        <input type="text" id="cPrice_aden" class="number-input" oninput="handlePriceInput(this, 'aden')">
                    </div>
                </div>
            </div>

            <!-- 銀票專用價格輸入區 -->
            <div id="ticket-inputs" class="currency-inputs">
                <div class="form-group">
                    <label for="eqPrice_ticket">武器單價 (銀票):</label>
                    <div class="input-wrap">
                        <input type="text" id="eqPrice_ticket" class="number-input" oninput="handlePriceInput(this, 'ticket')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="nPrice_ticket">武卷 單價 (銀票):</label>
                    <div class="input-wrap">
                        <input type="text" id="nPrice_ticket" class="number-input" oninput="handlePriceInput(this, 'ticket')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="bPrice_ticket">祝武卷 單價 (銀票):</label>
                    <div class="input-wrap">
                        <input type="text" id="bPrice_ticket" class="number-input" oninput="handlePriceInput(this, 'ticket')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cPrice_ticket">紅武卷 單價 (銀票):</label>
                    <div class="input-wrap">
                        <input type="text" id="cPrice_ticket" class="number-input" oninput="handlePriceInput(this, 'ticket')">
                    </div>
                </div>
            </div>
        </div>

        <!-- 成功機率設定 -->
        <div class="card">
            <h2>強化成功率與設定 (安定 6 目標 +9)</h2>
            <div class="form-group">
                <label for="p6to7">+6 升 +7 成功率 (33.3%):</label>
                <div class="input-wrap">
                    <input type="number" id="p6to7" step="0.1" value="33.3" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
            <div class="form-group">
                <label for="p7to8">+7 升 +8 成功率 (33.3%):</label>
                <div class="input-wrap">
                    <input type="number" id="p7to8" step="0.1" value="33.3" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
            <div class="form-group">
                <label for="p8to9">+8 升 +9 成功率 (33.3%):</label>
                <div class="input-wrap">
                    <input type="number" id="p8to9" step="0.1" value="33.3" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
            <div class="form-group">
                <label for="pB2Ratio">+5 祝武卷跳+2佔比:</label>
                <div class="input-wrap">
                    <input type="number" id="pB2Ratio" step="1" value="50" oninput="saveAndCalculate()">
                    <span class="unit-symbol">%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 計算結果展示 -->
    <div class="results">
        <h2>強化方案成本比較 (目標 +9 武器)</h2>
        <table>
            <thead>
                <tr>
                    <th>強化方案策略描述</th>
                    <th>+9 期望總成本 (<span class="unit-title">天幣</span>)</th>
                    <th>說明</th>
                </tr>
            </thead>
            <tbody id="result-rows">
                <!-- 動態繪製結果 -->
            </tbody>
        </table>
        <div class="note">
            * 武器安定值固定為 6，+5 使用祝武卷為 100% 成功（50% 跳+6 / 50% 跳+7）。<br>
            * 在 +6 以上使用祝武卷成功時只會 +1，不會再跳階。<br>
            * 所有計算結果與物品價格已全面實施「四捨五入至整數」。
        </div>
    </div>
</div>

<script>
    const defaultParams = {
        currency: 'aden',
        rate: 2600,
        
        eqPrice_aden: 200000,
        nPrice_aden: 50000,
        bPrice_aden: 1200000,
        cPrice_aden: 100000,

        eqPrice_ticket: 77,
        nPrice_ticket: 19,
        bPrice_ticket: 462,
        cPrice_ticket: 38,

        p6to7: 33.3,
        p7to8: 33.3,
        p8to9: 33.3,
        pB2Ratio: 50
    };

    let currentCurrency = 'aden';

    function formatThousands(val) {
        if (val === "" || val === null || val === undefined) return "";
        const cleanNum = Math.round(parseFloat(val.toString().replace(/,/g, '')));
        if (isNaN(cleanNum)) return "";
        return cleanNum.toLocaleString('zh-TW');
    }

    function parseNumber(val) {
        if (!val) return 0;
        const clean = val.toString().replace(/,/g, '');
        return Math.round(parseFloat(clean)) || 0;
    }

    function handleRateInput(input) {
        const rawValue = input.value.replace(/,/g, '');
        if (!isNaN(rawValue)) {
            input.value = formatThousands(rawValue);
        }
        syncAllCurrencies('aden');
        saveAndCalculate();
    }

    function handlePriceInput(input, sourceCurrency) {
        const rawValue = input.value.replace(/,/g, '');
        if (!isNaN(rawValue)) {
            input.value = formatThousands(rawValue);
        }
        
        syncPriceField(input.id, sourceCurrency);
        saveAndCalculate();
    }

    function syncPriceField(elementId, sourceCurrency) {
        const rate = parseNumber(document.getElementById('rate').value) || 1;
        const keysMap = {
            'eqPrice': ['eqPrice_aden', 'eqPrice_ticket'],
            'nPrice': ['nPrice_aden', 'nPrice_ticket'],
            'bPrice': ['bPrice_aden', 'bPrice_ticket'],
            'cPrice': ['cPrice_aden', 'cPrice_ticket']
        };

        let baseKey = elementId.replace('_aden', '').replace('_ticket', '');
        if (!keysMap[baseKey]) return;

        const [adenId, ticketId] = keysMap[baseKey];

        if (sourceCurrency === 'aden') {
            const adenVal = parseNumber(document.getElementById(adenId).value);
            const ticketVal = rate > 0 ? Math.round(adenVal / rate) : 0;
            document.getElementById(ticketId).value = formatThousands(ticketVal);
        } else {
            const ticketVal = parseNumber(document.getElementById(ticketId).value);
            const adenVal = Math.round(ticketVal * rate);
            document.getElementById(adenId).value = formatThousands(adenVal);
        }
    }

    function syncAllCurrencies(sourceCurrency) {
        const priceKeys = ['eqPrice', 'nPrice', 'bPrice', 'cPrice'];
        priceKeys.forEach(key => {
            const id = sourceCurrency === 'aden' ? `${key}_aden` : `${key}_ticket`;
            syncPriceField(id, sourceCurrency);
        });
    }

    function loadParams() {
        const stored = localStorage.getItem('lineage_weapon_calc_params_v1');
        let params = defaultParams;
        if (stored) {
            try {
                params = { ...defaultParams, ...JSON.parse(stored) };
            } catch (e) {
                params = defaultParams;
            }
        }

        document.getElementById('rate').value = formatThousands(params.rate || 2600);

        const priceKeys = [
            'eqPrice_aden', 'nPrice_aden', 'bPrice_aden', 'cPrice_aden',
            'eqPrice_ticket', 'nPrice_ticket', 'bPrice_ticket', 'cPrice_ticket'
        ];
        priceKeys.forEach(key => {
            const input = document.getElementById(key);
            if (input) input.value = formatThousands(params[key]);
        });

        const normalKeys = ['p6to7', 'p7to8', 'p8to9', 'pB2Ratio'];
        normalKeys.forEach(key => {
            const input = document.getElementById(key);
            if (input) input.value = params[key];
        });

        if (params.currency) currentCurrency = params.currency;
        updateCurrencyUI();
    }

    function saveParams() {
        const params = { currency: currentCurrency };

        params.rate = parseNumber(document.getElementById('rate').value);

        const priceKeys = [
            'eqPrice_aden', 'nPrice_aden', 'bPrice_aden', 'cPrice_aden',
            'eqPrice_ticket', 'nPrice_ticket', 'bPrice_ticket', 'cPrice_ticket'
        ];
        priceKeys.forEach(key => {
            const el = document.getElementById(key);
            params[key] = el ? parseNumber(el.value) : 0;
        });

        const normalKeys = ['p6to7', 'p7to8', 'p8to9', 'pB2Ratio'];
        normalKeys.forEach(key => {
            const el = document.getElementById(key);
            params[key] = el ? parseFloat(el.value) || 0 : 0;
        });

        localStorage.setItem('lineage_weapon_calc_params_v1', JSON.stringify(params));
    }

    function setCurrency(type) {
        currentCurrency = type;
        updateCurrencyUI();
        saveAndCalculate();
    }

    function updateCurrencyUI() {
        document.getElementById('btn-aden').classList.toggle('active', currentCurrency === 'aden');
        document.getElementById('btn-ticket').classList.toggle('active', currentCurrency === 'ticket');

        document.getElementById('aden-inputs').classList.toggle('active', currentCurrency === 'aden');
        document.getElementById('ticket-inputs').classList.toggle('active', currentCurrency === 'ticket');
        
        const unitText = currentCurrency === 'aden' ? '天幣' : '銀票';
        document.querySelectorAll('.unit-title').forEach(el => el.innerText = unitText);
    }

    function saveAndCalculate() {
        saveParams();
        calculate();
    }

    function formatNum(num) {
        if (isNaN(num) || !isFinite(num)) return "無法計算";
        const rounded = Math.round(num);
        return rounded.toLocaleString('zh-TW');
    }

    function calculate() {
        const suffix = currentCurrency === 'aden' ? '_aden' : '_ticket';

        const eqP = parseNumber(document.getElementById('eqPrice' + suffix).value);
        const nP = parseNumber(document.getElementById('nPrice' + suffix).value);
        const bP = parseNumber(document.getElementById('bPrice' + suffix).value);
        const cP = parseNumber(document.getElementById('cPrice' + suffix).value);

        const p6to7 = (parseFloat(document.getElementById('p6to7').value) || 0) / 100;
        const p7to8 = (parseFloat(document.getElementById('p7to8').value) || 0) / 100;
        const p8to9 = (parseFloat(document.getElementById('p8to9').value) || 0) / 100;
        const b2Ratio = (parseFloat(document.getElementById('pB2Ratio').value) || 0) / 100;

        if (p6to7 <= 0 || p7to8 <= 0 || p8to9 <= 0) return;

        // 安定範圍基礎成本 (+5 與 +6)
        const costPlus5 = eqP + (5 * nP);
        const costPlus6 = eqP + (6 * nP);

        // ----------------------------------------------------
        // 方案 A：全程普通武卷
        // ----------------------------------------------------
        const c7_PlanA = (costPlus6 + nP) / p6to7;
        const c8_PlanA = (c7_PlanA + nP) / p7to8;
        const c9_PlanA = (c8_PlanA + nP) / p8to9;

        // ----------------------------------------------------
        // 方案 B：+5 砸祝武卷（50% 跳+7，50% 變+6 補普通武卷）
        // ----------------------------------------------------
        const pB_jump2 = b2Ratio;
        const pB_jump1 = 1 - b2Ratio;
        // 方程式: costPlus5 + bP = pB_jump2 * C7 + pB_jump1 * (p6to7 * C7 - nP)
        const c7_PlanB_base = (costPlus5 + bP + (pB_jump1 * nP)) / (pB_jump2 + (pB_jump1 * p6to7));
        const c8_PlanB = (c7_PlanB_base + nP) / p7to8;
        const c9_PlanB = (c8_PlanB + nP) / p8to9;

        // ----------------------------------------------------
        // 方案 C：+5 砸祝武卷 + 紅武卷歸位循環（直到跳+7為止）
        // ----------------------------------------------------
        // 在 +5 點祝武卷 100% 成功: 50% 變 +7, 50% 變 +6 (用紅武卷降回 +5 再點)
        // 產出一件 +7 武器的期望成本:
        const c7_PlanC = costPlus5 + (bP + pB_jump1 * cP) / pB_jump2;
        const c8_PlanC = (c7_PlanC + nP) / p7to8;
        const c9_PlanC = (c8_PlanC + nP) / p8to9;

        // ----------------------------------------------------
        // 方案 D：+5 砸祝武卷，只賭 50% 直接跳 +7（變 +6 則停手不補卷）
        // ----------------------------------------------------
        const c7_PlanD = (costPlus5 + bP) / pB_jump2;
        const c8_PlanD = (c7_PlanD + nP) / p7to8;
        const c9_PlanD = (c8_PlanD + nP) / p8to9;

        const plans = [
            { name: "方案 B：+5 砸祝武卷（跳+7 或跳+6 補普通武卷）", cost: c9_PlanB, desc: "+5 砸祝武卷 100% 不爆！50% 直達 +7，若只跳 +6 則補普通武卷衝至 +9。" },
            { name: "方案 C：+5 砸祝武卷 + 紅武卷歸位（直達+7）", cost: c9_PlanC, desc: "+5 砸祝武卷，若只變 +6 則用紅武卷降回 +5 重點，直到跳 +7 再補武卷衝 +9。" },
            { name: "方案 D：+5 砸祝武卷（只賭 50% 爆升 +7）", cost: c9_PlanD, desc: "+5 砸祝武卷純賭跳 +2 直接獲得 +7，後續補普通武卷衝至 +9。" },
            { name: "方案 A：全用普通武卷硬衝", cost: c9_PlanA, desc: "一路點到 +6，之後全用普通武卷賭 33.3% 成功率硬衝到 +9。" }
        ];

        plans.sort((a, b) => a.cost - b.cost);

        const tbody = document.getElementById('result-rows');
        tbody.innerHTML = '';

        plans.forEach((plan, index) => {
            const tr = document.createElement('tr');
            if (index === 0) tr.classList.add('highlight');

            tr.innerHTML = `
                <td>
                    ${plan.name}
                    ${index === 0 ? '<span class="badge">最省錢首選</span>' : ''}
                </td>
                <td>${formatNum(plan.cost)}</td>
                <td>${plan.desc}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = function() {
        loadParams();
        calculate();
    };
</script>

</body>
</html>
